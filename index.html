    <meta charset="UTF-8" />

    <!-- Content Security Policy is set exclusively via the HTTP response header
         (vercel.json). A second policy used to be declared here as a <meta> tag;
         per the CSP spec, when two policies are delivered, a resource must be
         allowed by BOTH (the browser enforces the intersection). This one's
         script-src allowlist (gpteng.co, GTM, GA, apollo, createcdn) and the
         header's (jsdelivr, posthog, sentry) barely overlapped, so in practice
         almost every third-party script below was silently CSP-blocked in
         production -- confirmed live via browser console: GA4's gtag.js and the
         Apollo tracker were both actively blocked. Fixed 2026-09-17 by merging
         the two allowlists into the single header-delivered policy and removing
         this duplicate. -->

    <!-- Preconnect for critical third-party origins (≤4 to avoid browser contention) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://dmlxrvfyqsakyjomsvdj.supabase.co" crossorigin>
    <!-- Preconnect to Fontshare CDN: woff2 font files load from this origin (separate from api.fontshare.com CSS).
         Lighthouse network-dependency audit estimated ~80ms LCP savings. crossorigin required for fonts. -->
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    
    <!-- DNS Prefetch for less critical origins -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    
    <!-- Google Analytics 4: inert stub only. Consent Mode defaults every storage
         type to 'denied', and gtag.js itself is NOT loaded here: it loads from
         src/lib/third-party-trackers.ts only after the visitor accepts in the
         consent banner (src/lib/consent.ts). The Apollo.io visitor tracker that
         used to load here unconditionally moved behind the same consent gate. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      try {
        var c = JSON.parse(localStorage.getItem('aiwmc_tracking_consent_v1') || 'null');
        if (c && c.choice === 'granted') {
          gtag('consent', 'update', { analytics_storage: 'granted', ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted' });
        }
      } catch (e) { /* storage blocked: stay denied */ }
      gtag('js', new Date());
      gtag('config', 'G-08096HWB3B', { send_page_view: true });
    </script>

    </style>
