name: Vercel Production Deploy (one-click)

# One-click production deploy:
#   GitHub → Actions → "Vercel Production Deploy (one-click)" → Run workflow
#
# What this does (in order, each step gated by the previous one):
#   1. Secrets preflight       — fail fast with clear remediation if anything missing
#   2. Build (production env)  — Vite build with VITE_SUPABASE_* baked in
#   3. Vercel deploy --prod    — CLI deploy, captures new deployment URL
#   4. Smoke test              — curl the new URL; rollback if non-2xx
#   5. Deploy-fidelity gate    — verify edge function versions match source
#   6. Auto-rollback           — promote previous READY deployment on any failure
#   7. Slack notification      — success / failure / rolled_back, every run

on:
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: 'Skip post-deploy smoke test (NOT recommended)'
        type: boolean
        default: false

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build · Deploy · Verify · Rollback-on-fail
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PRO_ANNUAL_PRICE_ID }}
      DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      # ── 1. Preflight ───────────────────────────────────────────────────
      - name: Secrets preflight
        id: preflight
        run: bash scripts/preflight-secrets.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 2. Build ───────────────────────────────────────────────────────
      - name: Build (production)
        id: build
        run: bun run build

      # ── 3. Vercel CLI deploy ───────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel (deterministic prebuilt)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tail -n1)
          echo "Deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"

      # ── 4. Smoke test ──────────────────────────────────────────────────
      - name: Post-deploy smoke test
        id: smoke
        if: ${{ !inputs.skip_smoke }}
        run: |
          URL="${DEPLOY_URL}"
          echo "Smoking $URL"
          OK=0
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 5
          done
          if [ $OK -ne 1 ]; then
            echo "::error title=Smoke test failed::$URL never returned 200"
            exit 1
          fi

      # ── 5. Deploy-fidelity gate (live edge versions == source) ─────────
      - name: Deploy-fidelity gate
        id: fidelity
        env:
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/verify-deploy.sh

      # ── 6. Auto-rollback on any failure above ─────────────────────────
      - name: Auto-rollback to previous good deployment
        if: failure() && (steps.deploy.outcome == 'success')
        env:
          ROLLBACK_REASON: >-
            ${{ steps.fidelity.outcome == 'failure' && 'deploy-fidelity gate failed'
              || steps.smoke.outcome == 'failure' && 'smoke test failed'
              || 'post-deploy verification failed' }}
        run: bash scripts/vercel-rollback.sh

      # ── 7. Notify (always — success, failure, or rollback) ────────────
      - name: Notify deploy status
        if: always()
        env:
          STATUS: >-
            ${{ job.status == 'success' && 'success'
              || env.ROLLBACK_URL != '' && 'rolled_back'
              || 'failure' }}
          FAILING_STEP: >-
            ${{ steps.preflight.outcome == 'failure' && 'Secrets preflight'
              || steps.build.outcome == 'failure' && 'Build'
              || steps.deploy.outcome == 'failure' && 'Vercel deploy'
              || steps.smoke.outcome == 'failure' && 'Smoke test'
              || steps.fidelity.outcome == 'failure' && 'Deploy-fidelity gate'
              || '' }}
        run: bash scripts/notify-deploy-status.sh
