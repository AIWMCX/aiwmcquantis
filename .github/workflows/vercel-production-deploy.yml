name: Vercel Production Deploy (one-click)

# CI-gated production deployment that bypasses Vercel's Hobby-plan Git-author
# restriction. The Vercel token remains secret; project/team IDs are stable,
# non-secret identifiers verified against the connected Vercel account.
# Automatic runs are restricted below to successful pushes on this repository's
# own main branch before the Production environment can expose any secret.
#
# Steps:
#   1. Secrets preflight
#   2. Build the exact CI-approved commit
#   3. Deploy it to the verified Vercel project
#   4. Smoke-test the immutable deployment URL
#   5. Roll back to the previous READY production deployment on failure
#   6. Notify

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: 'Skip post-deploy smoke test (NOT recommended)'
        type: boolean
        default: false

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build · Deploy · Verify · Rollback-on-fail
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zdu4x3meMwZ86bPq8IbKila1
      VERCEL_PROJECT_ID: prj_LFp4jyVX7dzb0Xr34fej4FnMTz2g
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Secrets preflight
        id: preflight
        run: bash scripts/preflight-secrets.sh vercel

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (production)
        id: build
        run: bun run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # No --scope flag: VERCEL_ORG_ID + VERCEL_PROJECT_ID (env, above) are
      # sufficient on their own to fully disambiguate the team/project for
      # every `vercel` CLI call below. A prior attempt added `--scope aiwmc`
      # here, which caused a SEPARATE failure ("Not able to load user
      # because of unexpected error: User not found (404)") -- the CLI
      # apparently resolves --scope via a distinct user/account lookup that
      # doesn't recognize "aiwmc" as a user, even though it's a valid team
      # slug. Removed rather than debugged further, since the env vars
      # alone are the documented, sufficient mechanism for CI use.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel (deterministic prebuilt)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: deploy
        run: |
          set -o pipefail
          # `tail -n1` used to grab the literal last line of `vercel deploy`'s
          # output, assuming that was always the URL. Live-confirmed this is
          # wrong for this CLI version (59.5.0): the actual last lines are
          # "Completing…" / "▲ Aliased ..." / "✓ Ready in Ns", printed AFTER
          # the "Production      https://..." line. That false negative
          # caused a genuinely-successful deploy to be reported as failed,
          # skipping the smoke test / rollback safety net entirely.
          # Fix: capture every https:// URL in the output, drop the
          # "Inspect" line (a vercel.com dashboard link, never the
          # deployment itself), and take the first remaining match -- the
          # real "Production" deployment URL always appears before any
          # later Building/Aliased/Ready chatter.
          # --archive=tgz: uploads one gzipped tarball instead of every build
          # output file individually. Vercel's free-tier CLI upload quota
          # (api-upload-free) counts files-per-upload, not bytes -- this
          # project's ~5000+ output files exhausted it outright ("Too many
          # requests - try again in 24 hours (more than 5000)"), blocking
          # every deploy workflow sharing the account for the rest of the day.
          OUTPUT=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN" 2>&1 | tee /dev/stderr)
          # `|| true`: with pipefail + GitHub's default `bash -e`, a pipe that
          # matches nothing (grep exits 1) would abort the script here,
          # skipping the missing-URL check below entirely. The `if` block is
          # what's responsible for reporting that failure, not the pipeline.
          URL=$(echo "$OUTPUT" | grep -oE 'https://[^[:space:]]+' | grep -v '^https://vercel\.com/' | head -n1 || true)
          if [[ ! "$URL" =~ ^https:// ]]; then
            echo "::error title=Vercel deploy failed::CLI did not return a deployment URL"
            exit 1
          fi
          echo "Deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"

      - name: Post-deploy smoke test
        id: smoke
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_smoke }}
        run: |
          URL="${DEPLOY_URL}"
          echo "Smoking $URL"
          OK=0
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 5
          done
          if [ $OK -ne 1 ]; then
            echo "::error title=Smoke test failed::$URL never returned 200"
            exit 1
          fi

      - name: Auto-rollback to previous good deployment
        if: failure() && (steps.deploy.outcome == 'success')
        env:
          ROLLBACK_REASON: >-
            ${{ steps.smoke.outcome == 'failure' && 'smoke test failed'
              || 'post-deploy verification failed' }}
        run: bash scripts/vercel-rollback.sh

      - name: Notify deploy status
        if: always()
        env:
          STATUS: >-
            ${{ job.status == 'success' && 'success'
              || env.ROLLBACK_URL != '' && 'rolled_back'
              || 'failure' }}
          FAILING_STEP: >-
            ${{ steps.preflight.outcome == 'failure' && 'Secrets preflight'
              || steps.build.outcome == 'failure' && 'Build'
              || steps.deploy.outcome == 'failure' && 'Vercel deploy'
              || steps.smoke.outcome == 'failure' && 'Smoke test'
              || '' }}
        run: bash scripts/notify-deploy-status.sh
