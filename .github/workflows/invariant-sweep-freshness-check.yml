name: Invariant Sweep Freshness Check (scheduled)

# Charter 5.6's "missing daily run" alert (docs/execution/2026-08-27-
# phase5-revalidation.md), the second half of a two-part fix -- the
# first half (persistence-failure alerting) landed 2026-08-29 in
# scripts/sweep-financial-invariants.ts. This job answers a question
# neither the sweep's own success nor failure can answer: "did the sweep
# run at all?" A disabled/deleted workflow, a GitHub Actions outage, or
# a repository going dormant long enough for GitHub to auto-disable
# scheduled workflows would all produce silence, not a failing run --
# this checks for that silence directly.
#
# Runs more often (every 12 hours) than the sweep itself (daily) so a
# missed run is caught within half a day, not up to another full day late.

on:
  schedule:
    - cron: '52 */12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check the invariant sweep has run recently
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check freshness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing PAT::SUPABASE_ACCESS_TOKEN is not set in GitHub -> Settings -> Environments -> production -> Environment secrets. The check cannot run without it."
            exit 1
          fi
          deno run --allow-net --allow-env scripts/check-invariant-sweep-freshness.ts | tee -a "$GITHUB_STEP_SUMMARY"
