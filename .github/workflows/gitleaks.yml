name: gitleaks

# ============================================================================
# Secret-scanning gate.
# ----------------------------------------------------------------------------
# Blocks any PR or push to main that introduces a new hardcoded secret. Scoped
# to the diff/incoming commits only (not the full repo history on every run) --
# this repo's git history already contains historical secret-shaped strings
# from before this gate existed (see docs/OPEN_DEFECTS.json QNT-DEFECT-013);
# re-flagging those on every single run would train reviewers to ignore this
# check. .gitleaks.toml documents exactly what's allowlisted and why.
# ============================================================================

# Actions minutes: PRs only (the PR's commits are what reach main) plus a weekly
# run on main as a backstop for anything pushed outside a PR.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1' # Mondays 06:41 UTC
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan for hardcoded secrets
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned to a specific release + verified checksum -- never pipe an
      # unverified download straight into execution.
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # Scan only the commits actually being introduced, never the whole
      # repository history. This repo's history predates this gate (see
      # docs/OPEN_DEFECTS.json QNT-DEFECT-013) and a full-history scan would
      # red on every run regardless of what the current change touches.
      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.event.pull_request.base.ref }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # No usable "before" ref (new branch, or the old history became
              # unreachable e.g. after a force-push/rebase) -- fall back to a
              # bounded recent-history window rather than either a 1-commit
              # window (too narrow, could miss commits) or the full history
              # (defeats the purpose of this gate). 50 commits comfortably
              # covers any realistic single push to this repo.
              echo "range=-50" >> "$GITHUB_OUTPUT"
            else
              echo "range=${BEFORE}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run gitleaks on the new commits only
        run: gitleaks detect --source=. --config=.gitleaks.toml --log-opts="${{ steps.range.outputs.range }}" --redact -v
