name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Format · Typecheck · Verify · Tests · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Supabase project-ref guard (MUST run before lint generates lint-report.json) ──
      # lint:report embeds full file source in JSON — that JSON would then contain OLD_REF
      # from scripts/verify-env-refs.ts itself, causing a false positive. Run guard first.
      - name: Verify Supabase project refs (no stale gafx… ref in source)
        id: ref-guard
        run: npx tsx scripts/verify-env-refs.ts

      - name: Ref-guard failure hint
        if: failure() && steps.ref-guard.outcome == 'failure'
        run: |
          echo "::error title=Stale Supabase ref::Found gafxacjhkqsdzwwzhbor (old Lovable project) outside allowed paths. Replace with dmlxrvfyqsakyjomsvdj before building."

      # ── Deploy-coverage guard (makes BUG-037/038 + undeployed-worker impossible) ──
      # Every supabase/functions/* dir must be in the production-deploy.yml
      # FUNCTIONS array OR in supabase/functions/.deploy-ignore, AND no deployed
      # function may invoke an undeployed one. See scripts/verify-deploy-coverage.ts.
      - name: Verify edge-function deploy coverage
        id: deploy-coverage
        run: npx tsx scripts/verify-deploy-coverage.ts

      - name: Deploy-coverage failure hint
        if: failure() && steps.deploy-coverage.outcome == 'failure'
        run: |
          echo "::error title=Deploy coverage::An edge function is neither deployed nor ignored, or a deployed function invokes an undeployed worker. Run 'npx tsx scripts/verify-deploy-coverage.ts' locally."

      # ── Genesis P1 — per-call AI cost logging guard ───────────────────────
      # Every edge function that imports _shared/llm-call.ts (i.e. makes a
      # paid AI call) MUST also import _shared/ai-logger.ts. See plan P1.
      - name: Verify AI cost logging
        id: ai-cost-logging
        run: npx tsx scripts/verify-ai-cost-logging.ts

      - name: AI cost logging failure hint
        if: failure() && steps.ai-cost-logging.outcome == 'failure'
        run: |
          echo "::error title=AI cost logging::A paid AI call is not piped through ai-logger. Run 'npx tsx scripts/verify-ai-cost-logging.ts' locally."

      # ── Genesis P1/P2 — R3 enforcement at every LLM boundary ──────────────
      # Every deployed LLM function must wire r3-validator / boundary-schemas
      # OR appear in MIGRATION_ALLOWLIST (shrinking set, reviewed manually).
      - name: Verify R3 enforcement
        id: r3-enforcement
        run: npx tsx scripts/verify-r3-enforcement.ts

      - name: R3 enforcement failure hint
        if: failure() && steps.r3-enforcement.outcome == 'failure'
        run: |
          echo "::error title=R3 enforcement::A deployed LLM function bypasses r3-validator. Wire it or document the exemption in scripts/verify-r3-enforcement.ts."


      # ── DeepSeek deprecated-model guard (Fix #3) ─────────────────────────────
      # Legacy aliases retire 2026-07-24 15:59 UTC. Fail the build before they
      # silently break in production.
      - name: Check for deprecated DeepSeek model strings
        id: deepseek-guard
        run: |
          if grep -rnE "deepseek-chat|deepseek-reasoner" src/ supabase/ \
               --exclude-dir=node_modules \
               --include='*.ts' --include='*.tsx' --include='*.js'; then
            echo "::error title=Deprecated model string::Replace with 'deepseek-v4-flash' (see src/config/models.ts)."
            exit 1
          fi
          echo "✓ No legacy DeepSeek model strings present."

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint (eslint)
        id: lint
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint-output.txt
          bun run lint:report || true
        continue-on-error: false

      - name: Lint failure hint
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          echo "::error title=Lint failed::ESLint reported errors. See lint-output.txt artifact for full output, or run 'bun run lint' locally."

      # ── Format (Prettier, scoped) ───────────────────────────────────────────
      - name: Format check (Prettier)
        id: format
        run: bun run format:check
        continue-on-error: false

      - name: Format failure hint
        if: failure() && steps.format.outcome == 'failure'
        run: |
          echo "::error title=Prettier check failed::A file listed in .prettier-check-files.txt is not formatted. Run 'bun run format:write' locally and commit."

      # ── Typecheck ───────────────────────────────────────────────────────────
      - name: Typecheck (financial surface)
        id: typecheck
        run: bun run typecheck:financial

      - name: Typecheck failure hint
        if: failure() && steps.typecheck.outcome == 'failure'
        run: |
          echo "::error title=TypeScript failed::Financial-surface typecheck failed. Run 'bun run typecheck:financial' locally."

      # ── Financial sentinel scan (Handbook §19 Wave 1b) ──────────────────────
      # Guards src/financial/** against reintroducing raw 999/Infinity/NaN
      # sentinel literals in customer-facing payback output.
      - name: Sentinel scan (financial)
        id: sentinel-scan
        run: bun run scan:sentinels

      - name: Sentinel scan failure hint
        if: failure() && steps.sentinel-scan.outcome == 'failure'
        run: |
          echo "::error title=Sentinel leak::src/financial/** contains a raw 999/Infinity/NaN literal outside an allowed sentinel-scan-ignore line. Run 'bun run scan:sentinels' locally."

      # ── Business-logic hash verification ────────────────────────────────────
      - name: Verify business-logic spec hash
        id: verify
        run: bun run verify:business-logic

      - name: Verify failure hint
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          echo "::error title=Business-logic spec drift::The QUANTIS_BUSINESS_LOGIC.md hash in docs/ and public/docs/ does not match scripts/verify-business-logic-hash.ts. Regenerate the hash if the spec was intentionally changed."

      # ── Tests + coverage ────────────────────────────────────────────────────
      - name: Quality tests
        id: tests
        run: |
          set -o pipefail
          bun run test:quality 2>&1 | tee test-output.txt

      - name: Test failure hint
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "::error title=Tests failed::A quality test failed. See test-output.txt artifact, or run 'bun run test:quality' locally."

      - name: Coverage (best-effort)
        if: always()
        run: bun run test:coverage || true

      # ── Genesis P2 — deterministic engine gate ────────────────────────────
      # Re-runs the 25-fixture engine suite twice and asserts JSON-stringified
      # outputs are byte-identical. Catches hidden sources of nondeterminism
      # (Date.now, Math.random, undefined property order) creeping into math.
      - name: Verify engine determinism
        id: determinism
        run: npx tsx scripts/verify-determinism.ts

      - name: Determinism failure hint
        if: failure() && steps.determinism.outcome == 'failure'
        run: |
          echo "::error title=Determinism::The 25-fixture engine suite produced different outputs across two runs. A nondeterministic source crept into the math layer."


      # ── Build + prerender + unique-meta guard ───────────────────────────────
      # Audit 16-Jun-2026: regression guard against the SPA SEO bug returning
      # (every URL shipping the same homepage <title>). vite build runs the
      # prebuild prerender hook; then we assert every prerendered route has a
      # unique <title> + meta description.
      - name: Build (vite + prerender)
        id: build
        run: bun run build

      - name: Verify unique per-route head tags
        id: unique-meta
        run: npx tsx scripts/verify-unique-meta.ts

      - name: Unique-meta failure hint
        if: failure() && steps.unique-meta.outcome == 'failure'
        run: |
          echo "::error title=Duplicate per-route SEO::Two or more public routes ship identical <title> or meta description. The SPA SEO regression is back — check scripts/prerender-seo.ts and src/components/seo/RouteSEO.tsx."

      # ── Prerender regression tripwire (Task 2) ──────────────────────────────
      # Asserts: no route body equals homepage, no two bodies identical,
      # no "7-Layer" stale content, all required marker strings present,
      # Pro $49 in pricing route.
      # SKIP_MISSING=1: bun run build uses prerender-seo.ts (not Puppeteer),
      # so blog/example routes may not be emitted — treat as warnings only.
      # The full MISSING check runs in build:prod (Puppeteer) via seo-deploy.yml.
      - name: Prerender visibility gate
        id: visibility
        run: SKIP_MISSING=1 node scripts/verify-visibility.mjs

      - name: Visibility gate failure hint
        if: failure() && steps.visibility.outcome == 'failure'
        run: |
          echo "::error title=Prerender visibility gate::A route body equals the homepage shell, two routes share identical bodies, '7-Layer' reappeared, or a required content marker is missing. Run 'node scripts/verify-visibility.mjs' locally against dist/."

      # ── Baseline diff gate (Task 5) ─────────────────────────────────────────
      # Compares built output against baseline/MANIFEST.json. Any unannounced
      # change to a route body, title, or meta description fails the build.
      # Accept changes by running scripts/capture-baseline.sh and committing
      # the updated baseline/ in the same PR.
      - name: Diff against baseline
        id: baseline-diff
        run: bash scripts/diff-against-baseline.sh

      - name: Baseline diff failure hint
        if: failure() && steps.baseline-diff.outcome == 'failure'
        run: |
          echo "::error title=Baseline drift::An unannounced change to a route body, title, or meta was detected, OR the test count dropped. Run 'scripts/capture-baseline.sh' and commit the updated baseline/ in the same PR to accept the change."

      # ── Internal-link crawl-health gate (Prompt 2 F6) ───────────────────────
      # Walks dist/ HTML, asserts every public route is linked from somewhere,
      # and every internal <a href> resolves to a registry route or allowed SPA
      # path. SKIP_MISSING=1 because bun run build doesn't fully prerender.
      - name: Verify internal-link integrity
        id: internal-links
        run: SKIP_MISSING=1 node scripts/verify-internal-links.mjs

      - name: Internal-link failure hint
        if: failure() && steps.internal-links.outcome == 'failure'
        run: |
          echo "::error title=Internal-link integrity::An emitted route has zero inbound links (orphan), or an <a href> points to a destination not in seo.routes.mjs nor ALLOWED_SPA_PATHS. Fix the link target, add the route to the registry, or add to ALLOWED_SPA_PATHS in scripts/verify-internal-links.mjs."


      # ── Dependency security audit ───────────────────────────────────────────
      - name: Dependency audit (bun)
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          bun pm audit --prod 2>&1 | tee audit-report.txt || true

      - name: Audit summary
        if: always()
        run: |
          if grep -qE "high|critical" audit-report.txt 2>/dev/null; then
            echo "::warning title=Dependency audit::High or critical advisories detected. See audit-report.txt artifact."
          else
            echo "Dependency audit clean (no high/critical advisories)."
          fi

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: |
            lint-output.txt
            lint-report.json
            test-output.txt
            audit-report.txt
            coverage/**
          if-no-files-found: ignore
          retention-days: 14

      # ── Job summary ─────────────────────────────────────────────────────────
      - name: CI summary
        if: always()
        run: |
          {
            echo "## AIWMC Quantis — CI"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Format (prettier) | ${{ steps.format.outcome }} |"
            echo "| Typecheck (financial) | ${{ steps.typecheck.outcome }} |"
            echo "| Sentinel scan (financial) | ${{ steps.sentinel-scan.outcome }} |"
            echo "| Supabase ref guard | ${{ steps.ref-guard.outcome }} |"
            echo "| Business-logic hash | ${{ steps.verify.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo "| Determinism | ${{ steps.determinism.outcome }} |"
            echo "| Prerender visibility | ${{ steps.visibility.outcome }} |"
            echo "| Baseline diff | ${{ steps.baseline-diff.outcome }} |"
            echo "| Audit | ${{ steps.audit.outcome }} |"
            echo ""
            echo "Download \`ci-artifacts-${{ github.run_id }}\` for lint, test, and audit logs."
          } >> "$GITHUB_STEP_SUMMARY"
