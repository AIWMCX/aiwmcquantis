name: Production Deploy

# Auto deploy to production after CI passes on main.
# Uses the "production" GitHub Environment (configure required reviewers there
# if you want a manual approval gate). No-op when hosting secrets are absent.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to production
    # Only when the triggering CI run actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (production)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      # ── Frontend deploy note ──────────────────────────────────────────────────
      # Vercel's GitHub git-integration auto-deploys on every push to main.
      # A redundant CLI deploy via VERCEL_TOKEN was causing two competing
      # deployments and a flaky smoke test (brief "building" window).
      # The CLI deploy is intentionally removed; Vercel git integration owns this.
      - name: Frontend deploy (Vercel git integration)
        run: |
          {
            echo "## Frontend deploy"
            echo ""
            echo "Vercel git integration deploys automatically on push to main."
            echo "No CLI deploy needed — see the Vercel dashboard for deployment status."
            echo "Build artifact validated by the Build step above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy smoke test
        # Non-blocking: a transient CDN hiccup must not fail the deploy workflow.
        # Use www (canonical production host) not apex (308 redirect).
        continue-on-error: true
        env:
          SMOKE_URL: ${{ secrets.PRODUCTION_SMOKE_URL || 'https://www.aiwmcquantis.com' }}
        run: |
          echo "Smoke testing: $SMOKE_URL"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$SMOKE_URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "::notice title=Smoke OK::$SMOKE_URL returned 200"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Smoke test::$SMOKE_URL did not return 200 after 5 attempts (last: $CODE) — Vercel may still be propagating"
          exit 0

  run-migrations:
    name: Apply Supabase DB Migrations
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Apply migrations via Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "⚠ SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD not set — skipping migrations" >> "$GITHUB_STEP_SUMMARY"
            echo "Add SUPABASE_DB_PASSWORD to GitHub Secrets (Supabase Dashboard → Settings → Database → Connection string password)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm install -g supabase@2.20.5 2>/dev/null || true
          # link prompts for the DB password when run interactively — in CI it must
          # be passed via -p or the command exits non-zero and kills the whole job
          # (which then skips deploy-edge-functions via `needs`). Root cause of the
          # red Production Deploy runs #162-#174.
          npx supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" || {
            echo "::warning title=Link failed::supabase link failed — skipping migrations (edge functions still deploy)"
            exit 0
          }
          # Push all pending migrations (idempotent — skips already-applied ones)
          npx supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all 2>&1 || {
            echo "::warning title=Migration warn::db push exited non-zero — check output above"
          }
          echo "✓ Migrations applied (or were already up to date)" >> "$GITHUB_STEP_SUMMARY"

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: [run-migrations]
    # always(): edge functions must deploy even if migrations job failed —
    # a migration hiccup must never freeze function code in production.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── Token preflight ──────────────────────────────────────────────────────
      # Root cause of red Production Deploy #210: if SUPABASE_ACCESS_TOKEN is
      # missing/expired/revoked (e.g. mid-PAT-rotation), EVERY `npx supabase`
      # call fails — including the secret-sync step — and (when that step lacked
      # continue-on-error) the whole job died at ~47s before a single function
      # deployed. This preflight fails fast with an unambiguous message instead.
      - name: Preflight — verify Supabase access token
        id: preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing PAT::SUPABASE_ACCESS_TOKEN is not set in GitHub → Settings → Secrets → Actions. Edge functions cannot deploy. Add a valid Supabase Personal Access Token (supabase.com/dashboard/account/tokens)."
            exit 1
          fi
          npm install -g supabase@2.20.5 2>/dev/null || true
          # `supabase projects list` is a cheap authenticated call. If the PAT is
          # invalid/revoked it returns non-zero here with a clear message.
          if ! npx supabase projects list >/dev/null 2>&1; then
            echo "::error title=Invalid PAT::SUPABASE_ACCESS_TOKEN is set but rejected by Supabase (expired or revoked). Rotate it at supabase.com/dashboard/account/tokens and update the GitHub secret. This is the #1 cause of a fast-failing Production Deploy."
            exit 1
          fi
          echo "✓ Supabase access token is valid" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync Supabase runtime secrets
        # Non-fatal: a secret-sync hiccup must NEVER block deploying function code.
        # The functions still run with whatever secrets are already set in Supabase.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
          STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PRO_ANNUAL_PRICE_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping secret sync" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm install -g supabase@2.20.5 2>/dev/null || true
          # Push runtime secrets that edge functions read at invocation time.
          # DEEPSEEK_API_KEY: used by rvce-validate, generate-idea, analyze-* (DeepSeek LLM calls)
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            npx supabase secrets set DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" --project-ref "$PROJECT_REF"
            echo "✓ DEEPSEEK_API_KEY synced to Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Missing secret::DEEPSEEK_API_KEY not in GitHub secrets — RVCE and analysis functions will fail"
          fi
          # STRIPE secrets: required by stripe-webhook, create-checkout-session, create-portal-session
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            npx supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --project-ref "$PROJECT_REF"
            echo "✓ STRIPE_SECRET_KEY synced to Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Missing secret::STRIPE_SECRET_KEY not set — payments will fail"
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            npx supabase secrets set STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" --project-ref "$PROJECT_REF"
            echo "✓ STRIPE_WEBHOOK_SECRET synced to Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Missing secret::STRIPE_WEBHOOK_SECRET not set — webhook signature verification will FAIL and subscriptions will not activate"
          fi
          # NOTE: every optional secret uses if/then, NOT bare `[ -n ] && cmd`.
          # When the var is empty, `[ -n ] && cmd` evaluates false (exit 1); as
          # the script's last statement that failed the whole step — root cause
          # of every red Production Deploy from #162 onward (TAVILY_API_KEY).
          if [ -n "$STRIPE_PRO_MONTHLY_PRICE_ID" ]; then npx supabase secrets set STRIPE_PRO_MONTHLY_PRICE_ID="$STRIPE_PRO_MONTHLY_PRICE_ID" --project-ref "$PROJECT_REF"; fi
          if [ -n "$STRIPE_PRO_ANNUAL_PRICE_ID" ]; then npx supabase secrets set STRIPE_PRO_ANNUAL_PRICE_ID="$STRIPE_PRO_ANNUAL_PRICE_ID" --project-ref "$PROJECT_REF"; fi
          # LOVABLE_API_KEY: optional legacy gateway (DeepSeek is primary since Lovable migration)
          if [ -n "$LOVABLE_API_KEY" ]; then npx supabase secrets set LOVABLE_API_KEY="$LOVABLE_API_KEY" --project-ref "$PROJECT_REF"; fi
          # ANTHROPIC_API_KEY: hard fallback for aiCall() when DeepSeek/Lovable fail (RVCE excluded — DeepSeek-only by policy)
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npx supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
            echo "✓ ANTHROPIC_API_KEY synced to Supabase (Claude fallback enabled)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Missing secret::ANTHROPIC_API_KEY not set — no Claude fallback if DeepSeek fails" >> "$GITHUB_STEP_SUMMARY"
          fi
          # TAVILY_API_KEY: optional search enhancement for RVCE
          if [ -n "$TAVILY_API_KEY" ]; then npx supabase secrets set TAVILY_API_KEY="$TAVILY_API_KEY" --project-ref "$PROJECT_REF"; fi
          echo "Secret sync complete" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          # Guard: skip gracefully if secret not configured yet
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping edge function deploy" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm install -g supabase@2.20.5 2>/dev/null || true
          FUNCTIONS=(
            # ── Billing (must deploy first so payments work) ──────────────
            stripe-webhook
            create-checkout-session
            create-portal-session
            # ── Core analysis pipeline ────────────────────────────────────
            analyze-business
            analyze-plus
            analyze-pro-extension
            analyze-pro-worker
            ai-narrator
            calculate-financials
            # ── User-facing widgets ───────────────────────────────────────
            invoice-capacity-check
            benchmarks-query
            rvce-validate
            generate-idea
            share-report
            # ── Document / export ─────────────────────────────────────────
            generate-document
            generate-document-content
            export-document
            pdf-generator
            parse-document
            queue-export
            # ── Intelligence / scenarios ──────────────────────────────────
            ai-consensus
            analyze-preview
            # ── API / team ────────────────────────────────────────────────
            create-api-key
            team-invite
            # ── Lifecycle emails ──────────────────────────────────────────
            send-welcome-email
            send-lifecycle-email
            confirm-email-subscription
            # ── Platform / infra ──────────────────────────────────────────
            health-check
            warm-functions
            manage-benchmarks
            manage-knowledge-base
            self-learning-update
            process-subscription-downgrades
            # ── Entitlements / admin observability (June stabilization) ───
            entitlements-snapshot
            admin-health-sweep
            # ── Autoposter integration (OAuth + Meta credential bootstrap) ──
            oauth-linkedin-callback
            oauth-twitter-callback
            meta-credentials-setup
          )
          # Functions that must be callable without a JWT (email confirm/unsubscribe links)
          NO_VERIFY_JWT_FNS="confirm-email-subscription"

          FAILED=()
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn …"
            EXTRA_FLAGS=""
            if echo "$NO_VERIFY_JWT_FNS" | grep -qw "$fn"; then
              EXTRA_FLAGS="--no-verify-jwt"
            fi
            if npx supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api $EXTRA_FLAGS 2>&1; then
              echo "✓ $fn deployed"
            else
              echo "✗ $fn FAILED"
              FAILED+=("$fn")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error title=Edge function deploy failures::${FAILED[*]}"
            exit 1
          fi
          echo "All edge functions deployed successfully" >> "$GITHUB_STEP_SUMMARY"

      # ── Post-deploy smoke test (Fix #1) ──────────────────────────────────────
      # Confirm analyze-business is actually live. A 2xx/4xx response proves the
      # function reachable; only a 5xx or curl error means the deploy didn't land.
      - name: Post-deploy smoke test (analyze-business)
        env:
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Smoke test skipped::PROJECT_REF or anon key missing"
            exit 0
          fi
          URL="https://$PROJECT_REF.supabase.co/functions/v1/analyze-business"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"ping":true}' "$URL" || echo "000")
          echo "analyze-business smoke → HTTP $CODE"
          # 2xx/4xx = function reachable. 5xx or 000 = deploy didn't land.
          if [ "$CODE" -ge 500 ] 2>/dev/null || [ "$CODE" = "000" ]; then
            echo "::error title=Edge function unreachable::analyze-business returned $CODE — deploy may not have landed."
            exit 1
          fi
          echo "✓ analyze-business reachable (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"

      # ── Deploy-fidelity gate ─────────────────────────────────────────────────
      # Curl every function's ?health=1 endpoint and assert live FUNCTION_VERSION
      # matches the constant in source. This is what makes "CI green" actually
      # mean "the new code is live", not "the deploy command exited 0".
      # See scripts/verify-deploy.sh.
      - name: Verify deploy fidelity (live version == source version)
        env:
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Deploy-fidelity gate skipped::PROJECT_REF or anon key missing"
            exit 0
          fi
          bash scripts/verify-deploy.sh

