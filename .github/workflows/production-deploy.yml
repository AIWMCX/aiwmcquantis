name: Production Deploy

# Fires automatically after CI passes on main, or manually via workflow_dispatch.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Supabase DB Migrations ───────────────────────────────────────────────
      - name: Apply Supabase DB migrations
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase@latest link --project-ref dmlxrvfyqsakyjomsvdj
          npx supabase@latest db push --include-all --yes || true
          echo "✅ DB migrations pushed" >> "$GITHUB_STEP_SUMMARY"

      # ── Supabase Edge Functions ──────────────────────────────────────────────
      - name: Deploy Supabase edge functions
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase@latest functions deploy analyze-business \
            --project-ref dmlxrvfyqsakyjomsvdj \
            --no-verify-jwt
          npx supabase@latest functions deploy analyze-plus \
            --project-ref dmlxrvfyqsakyjomsvdj \
            --no-verify-jwt
          npx supabase@latest functions deploy analyze-pro-extension \
            --project-ref dmlxrvfyqsakyjomsvdj \
            --no-verify-jwt
          echo "✅ Edge functions deployed to dmlxrvfyqsakyjomsvdj" >> "$GITHUB_STEP_SUMMARY"

      # ── Frontend Build ───────────────────────────────────────────────────────
      - name: Build (production)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      # ── Frontend Deploy ──────────────────────────────────────────────────────
      - name: Detect deploy provider
        id: provider
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "provider=vercel" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "provider=netlify" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (production)
        id: deploy
        if: steps.provider.outputs.provider == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel@latest build --prod --token "$VERCEL_TOKEN"
          URL=$(bunx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Netlify (production)
        id: deploy-netlify
        if: steps.provider.outputs.provider == 'netlify'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bunx netlify-cli@latest deploy --prod --dir=dist --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" --json | tee netlify.json
          URL=$(jq -r '.deploy_url' netlify.json)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.provider.outputs.provider != 'none'
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.url || steps.deploy-netlify.outputs.url || 'https://aiwmcquantis.com' }}
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$SMOKE_URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "::notice title=Smoke OK::$SMOKE_URL returned 200" && exit 0
            fi
            sleep 5
          done
          echo "::warning title=Smoke::$SMOKE_URL did not return 200"

      - name: Lovable publish (no hosting secrets configured)
        if: steps.provider.outputs.provider == 'none'
        run: |
          {
            echo "## Deploy via Lovable"
            echo ""
            echo "Frontend is published via Lovable. Supabase DB + functions deployed above."
            echo "To enable GitHub-based frontend deploy: add VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID"
            echo "to Settings → Environments → production."
          } >> "$GITHUB_STEP_SUMMARY"
