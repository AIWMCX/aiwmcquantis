name: Production Deploy — Supabase Backend

# Fires automatically after CI passes on main, or manually.
# Scope: DB migrations + edge functions ONLY.
# Frontend is deployed by Lovable (lovable.dev) which owns aiwmcquantis.com.
# Do NOT add Vercel/Netlify steps — they would conflict with Lovable's domain.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Supabase backend
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── DB Migrations ────────────────────────────────────────────────────────
      - name: Apply DB migrations
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase@latest link --project-ref dmlxrvfyqsakyjomsvdj
          npx supabase@latest db push --include-all --yes || true
          echo "✅ DB migrations applied to dmlxrvfyqsakyjomsvdj" >> "$GITHUB_STEP_SUMMARY"

      # ── Edge Functions ───────────────────────────────────────────────────────
      - name: Deploy edge functions
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase@latest functions deploy analyze-business \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          npx supabase@latest functions deploy analyze-plus \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          npx supabase@latest functions deploy analyze-pro-extension \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          echo "✅ Edge functions deployed to dmlxrvfyqsakyjomsvdj" >> "$GITHUB_STEP_SUMMARY"

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Deployment summary
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          {
            echo "## Backend Deployed"
            echo "- Project: dmlxrvfyqsakyjomsvdj (AIWMC QUANTIS)"
            echo "- analyze-business: FREE_TIER_LIMIT=5, increment_usage"
            echo "- analyze-plus + analyze-pro-extension: latest"
            echo ""
            echo "Frontend: deployed separately via Lovable → aiwmcquantis.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No token — skipped
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN not set. Add it to GitHub → Settings → Environments → production." >> "$GITHUB_STEP_SUMMARY"
