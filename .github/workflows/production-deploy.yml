            parse-document
            queue-export
            # ── Intelligence / scenarios ──────────────────────────────────
            ai-consensus
            analyze-preview
            create-scenario-set
            run-scenario
            promote-scenario
            promote-scenario-to-analysis
            scenario-breakpoint
            review-decision
            # ── API / team ────────────────────────────────────────────────
            create-api-key
            team-invite
            # ── Lifecycle emails ──────────────────────────────────────────
            send-welcome-email
            send-lifecycle-email
            confirm-email-subscription
            # ── Platform / infra ──────────────────────────────────────────
            health-check
            system-status
            warm-functions
            # bot-detection: authored and merged in PR #107 (2026-09-05), but
            # never added to this list -- the same defect class documented
            # below for run-tier-qa-harness/run-accuracy-harness. Confirmed
            # live 2026-09-17: the function has never existed on the Supabase
            # project (list_edge_functions doesn't show it, get_edge_function
            # returns NotFoundException), so every homepage load's
            # useBotDetection() call has been hitting a nonexistent endpoint
            # and failing its CORS preflight since merge. Low customer impact
            # (telemetry-only, wrapped in try/catch, doesn't gate anything),
            # but real and dark for ~12 days. Added here so this and any
            # future change to supabase/functions/bot-detection/ actually ships.
            bot-detection
            manage-benchmarks
            manage-knowledge-base
            self-learning-update
            process-subscription-downgrades
            # ── Entitlements / admin observability (June stabilization) ───
            entitlements-snapshot
            admin-health-sweep
            # ── Autoposter integration (OAuth + Meta credential bootstrap) ──
            oauth-linkedin-callback
            # Autoposter: generation (#244) and scheduled publishing were never in this
            # list, so their source changes did not ship (found 2026-10-15).
            autoposter-generate-content
            publish-due-posts
            oauth-twitter-callback
            meta-credentials-setup
            # ── QOC orchestration layer ────────────────────────────────────
            qoc-orchestrate
            # ── Content Studio (admin/content_admin tooling) ───────────────
            # Was on .deploy-ignore over a verify-ai-cost-logging concern that
            # no longer applies: this function doesn't import _shared/llm-call.ts
            # or _shared/hybrid-validator.ts (the guard's only triggers) — it
            # logs cost to ai_calls itself. Promoted 2026-08-24 after commit
            # 20ff6af2's content_admin role change sat undeployed for a month.
            content-studio-generate
            content-plan-import
