name: Production Deploy — Supabase Backend

# Fires automatically after CI passes on main, or manually.
# Scope: secrets sync + DB migrations + edge functions ONLY.
# Frontend is deployed by Lovable (lovable.dev) which owns aiwmcquantis.com.
# Do NOT add Vercel/Netlify steps — they would conflict with Lovable's domain.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Supabase backend
    # Only run when CI passed, or manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    # CRITICAL: secrets.X is ONLY valid inside ${{ }} and env:/with:/run: blocks.
    # It CANNOT be used directly in step-level if: conditions.
    # Solution: expose ALL secrets as job-level env vars, then test env.X in if: conditions.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── Secrets Sync ─────────────────────────────────────────────────────────
      # Sets all LLM provider keys in Supabase so they survive Lovable publishes.
      - name: Sync edge function secrets
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          # Free tier: Lovable AI Gateway (Gemini) → DeepSeek → deterministic
          # Plus tier: Claude (Anthropic) — kept for premium differentiation
          npx supabase@latest secrets set \
            DEEPSEEK_API_KEY="${DEEPSEEK_API_KEY}" \
            LOVABLE_API_KEY="${LOVABLE_API_KEY:-lv_placeholder_gemini_primary}" \
            ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-placeholder_plus_only}" \
            LLM_PRIMARY_PROVIDER="lovable" \
            LLM_DEEPSEEK_ENABLED="true" \
            --project-ref dmlxrvfyqsakyjomsvdj || true
          echo "✅ Secrets synced" >> "$GITHUB_STEP_SUMMARY"

      # ── DB Migrations ────────────────────────────────────────────────────────
      - name: Apply DB migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx supabase@latest link --project-ref dmlxrvfyqsakyjomsvdj
          npx supabase@latest db push --include-all --yes || true
          echo "✅ DB migrations applied" >> "$GITHUB_STEP_SUMMARY"

      # ── Edge Functions ───────────────────────────────────────────────────────
      # Free tier: Lovable AI (Gemini Flash) → DeepSeek → deterministic narrative
      # Plus tier: Claude Sonnet (premium differentiator)
      - name: Deploy edge functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx supabase@latest functions deploy analyze-business \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          npx supabase@latest functions deploy analyze-plus \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          npx supabase@latest functions deploy analyze-pro-extension \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          echo "✅ Edge functions deployed" >> "$GITHUB_STEP_SUMMARY"

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Deployment summary
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          {
            echo "## ✅ AIWMC Quantis — Backend Deployed"
            echo ""
            echo "| Component | Value |"
            echo "|-----------|-------|"
            echo "| Project | dmlxrvfyqsakyjomsvdj (AIWMC QUANTIS) |"
            echo "| Free LLM | Lovable AI (Gemini Flash) → DeepSeek → deterministic |"
            echo "| Plus LLM | Claude Sonnet (Anthropic) |"
            echo "| analyze-business | ✅ deployed |"
            echo "| analyze-plus | ✅ deployed |"
            echo "| analyze-pro-extension | ✅ deployed |"
            echo ""
            echo "Frontend: Lovable → aiwmcquantis.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No token — deploy skipped
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "⚠️ SUPABASE_ACCESS_TOKEN not set → Settings → Environments → production" >> "$GITHUB_STEP_SUMMARY"
          exit 1
