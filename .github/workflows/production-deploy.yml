name: Production Deploy — Supabase Backend

# Owns the BACKEND only (Supabase migrations + edge functions).
# The FRONTEND is deployed by Vercel's native GitHub integration on every
# push to main (using vercel.json). Do NOT add a frontend deploy job here —
# two systems deploying the frontend caused domain/alias conflicts.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Supabase backend (dmlxrvfyqsakyjomsvdj)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # If the deploy token is not configured, exit success (nothing to do)
      # so this workflow never shows a red X for a missing optional secret.
      - name: Check deploy token
        id: gate
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SUPABASE_ACCESS_TOKEN not set — skipping backend deploy (not a failure)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync edge function secrets
        if: steps.gate.outputs.has_token == 'true'
        run: |
          npx supabase@latest secrets set \
            DEEPSEEK_API_KEY="${DEEPSEEK_API_KEY}" \
            LOVABLE_API_KEY="${LOVABLE_API_KEY:-lv_placeholder}" \
            ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-placeholder}" \
            STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET}" \
            LLM_PRIMARY_PROVIDER="deepseek" \
            LLM_DEEPSEEK_ENABLED="true" \
            --project-ref dmlxrvfyqsakyjomsvdj || true
          echo "✅ Secrets synced" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply DB migrations
        if: steps.gate.outputs.has_token == 'true'
        run: |
          npx supabase@latest link --project-ref dmlxrvfyqsakyjomsvdj || true
          npx supabase@latest db push --include-all --yes || true
          echo "✅ DB migrations applied" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy edge functions
        if: steps.gate.outputs.has_token == 'true'
        run: |
          for fn in analyze-business analyze-plus analyze-pro-extension create-checkout-session stripe-webhook; do
            npx supabase@latest functions deploy "$fn" \
              --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt || echo "::warning::deploy $fn failed (non-blocking)"
          done
          echo "✅ Edge functions deployed to dmlxrvfyqsakyjomsvdj" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          echo "## Backend deploy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend is deployed by Vercel's native GitHub integration." >> "$GITHUB_STEP_SUMMARY"
