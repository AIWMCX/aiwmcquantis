name: Production Deploy

# Auto deploy to production after CI passes on main.
# Uses the "production" GitHub Environment (configure required reviewers there
# if you want a manual approval gate). No-op when hosting secrets are absent.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to production
    # Only when the triggering CI run actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (production)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      # ── Frontend deploy note ──────────────────────────────────────────────────
      # Vercel's GitHub git-integration auto-deploys on every push to main.
      # A redundant CLI deploy via VERCEL_TOKEN was causing two competing
      # deployments and a flaky smoke test (brief "building" window).
      # The CLI deploy is intentionally removed; Vercel git integration owns this.
      - name: Frontend deploy (Vercel git integration)
        run: |
          {
            echo "## Frontend deploy"
            echo ""
            echo "Vercel git integration deploys automatically on push to main."
            echo "No CLI deploy needed — see the Vercel dashboard for deployment status."
            echo "Build artifact validated by the Build step above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy smoke test
        # Non-blocking: a transient CDN hiccup must not fail the deploy workflow.
        # Use www (canonical production host) not apex (308 redirect).
        continue-on-error: true
        env:
          SMOKE_URL: ${{ secrets.PRODUCTION_SMOKE_URL || 'https://www.aiwmcquantis.com' }}
        run: |
          echo "Smoke testing: $SMOKE_URL"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$SMOKE_URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "::notice title=Smoke OK::$SMOKE_URL returned 200"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Smoke test::$SMOKE_URL did not return 200 after 5 attempts (last: $CODE) — Vercel may still be propagating"
          exit 0

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sync Supabase runtime secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping secret sync" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm install -g supabase@latest 2>/dev/null || true
          # Push runtime secrets that edge functions read at invocation time.
          # DEEPSEEK_API_KEY: used by rvce-validate, generate-idea, analyze-* (DeepSeek LLM calls)
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            npx supabase secrets set DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" --project-ref "$PROJECT_REF"
            echo "✓ DEEPSEEK_API_KEY synced to Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Missing secret::DEEPSEEK_API_KEY not in GitHub secrets — RVCE and analysis functions will fail"
          fi

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          # Guard: skip gracefully if secret not configured yet
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping edge function deploy" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm install -g supabase@latest 2>/dev/null || true
          FUNCTIONS=(
            rvce-validate
            generate-idea
            manage-benchmarks
            self-learning-update
            analyze-business
            analyze-plus
            analyze-pro-extension
          )
          FAILED=()
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn …"
            if npx supabase functions deploy "$fn" --project-ref "$PROJECT_REF" 2>&1; then
              echo "✓ $fn deployed"
            else
              echo "✗ $fn FAILED"
              FAILED+=("$fn")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error title=Edge function deploy failures::${FAILED[*]}"
            exit 1
          fi
          echo "All edge functions deployed successfully" >> "$GITHUB_STEP_SUMMARY"
