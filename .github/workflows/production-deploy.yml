name: Production Deploy — Backend + Frontend

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Supabase backend (dmlxrvfyqsakyjomsvdj)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sync edge function secrets
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx supabase@latest secrets set \
            DEEPSEEK_API_KEY="${DEEPSEEK_API_KEY}" \
            LOVABLE_API_KEY="${LOVABLE_API_KEY:-lv_placeholder_deepseek_primary}" \
            ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-placeholder_plus_only}" \
            LLM_PRIMARY_PROVIDER="deepseek" \
            LLM_DEEPSEEK_ENABLED="true" \
            --project-ref dmlxrvfyqsakyjomsvdj || true
          echo "✅ Secrets synced" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply DB migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx supabase@latest link --project-ref dmlxrvfyqsakyjomsvdj
          npx supabase@latest db push --include-all --yes || true
          echo "✅ DB migrations applied" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy edge functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx supabase@latest functions deploy analyze-business \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          npx supabase@latest functions deploy analyze-plus \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          npx supabase@latest functions deploy analyze-pro-extension \
            --project-ref dmlxrvfyqsakyjomsvdj --no-verify-jwt
          echo "✅ Edge functions deployed to dmlxrvfyqsakyjomsvdj" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend to Vercel (dmlxrvfyqsakyjomsvdj URL)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend with dmlxrvfyqsakyjomsvdj
        if: env.VERCEL_TOKEN != ''
        env:
          VITE_SUPABASE_URL: https://dmlxrvfyqsakyjomsvdj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: dmlxrvfyqsakyjomsvdj
        run: |
          bun run build
          echo "✅ Frontend built with dmlxrvfyqsakyjomsvdj" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel@latest deploy ./dist \
            --token="${VERCEL_TOKEN}" \
            --prod \
            --yes \
            -e VITE_SUPABASE_URL="https://dmlxrvfyqsakyjomsvdj.supabase.co" \
            -e VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -e VITE_SUPABASE_PROJECT_ID="dmlxrvfyqsakyjomsvdj"
          echo "✅ Frontend deployed to Vercel" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip — no Vercel token
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "⚠️ VERCEL_TOKEN not set — frontend deployment skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Set VERCEL_TOKEN in GitHub → Settings → Environments → production"
