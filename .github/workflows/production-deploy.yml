            # pipeline, paced outreach sender (pg_cron every 5 min).
            business-mail
            # ── Observability harnesses (admin dashboard reads their output) ─
            # Missing from the list meant source changes to these functions
            # never actually shipped. Confirmed 2026-07-02: after PR #4
            # merged, every other function's ?health=1 returned the merge
            # sha; run-tier-qa-harness returned 404 — never deployed via
            # this workflow at all.
            run-tier-qa-harness
            run-accuracy-harness
          )
          # Functions that must be callable without a JWT (email confirm/unsubscribe links,
          # OAuth callbacks that the provider redirects to). Each authenticates itself.
          NO_VERIFY_JWT_FNS="confirm-email-subscription oauth-linkedin-callback"

          FAILED=()
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn …"
            EXTRA_FLAGS=""
            if echo "$NO_VERIFY_JWT_FNS" | grep -qw "$fn"; then
              EXTRA_FLAGS="--no-verify-jwt"
            fi
            if supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api $EXTRA_FLAGS 2>&1; then
              echo "✓ $fn deployed"
            else
              echo "✗ $fn FAILED"
              FAILED+=("$fn")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error title=Edge function deploy failures::${FAILED[*]}"
            exit 1
          fi
          echo "All edge functions deployed successfully" >> "$GITHUB_STEP_SUMMARY"

      # ── Post-deploy smoke test (Fix #1) ──────────────────────────────────────
      # Confirm analyze-business is actually live. A 2xx/4xx response proves the
      # function reachable; only a 5xx or curl error means the deploy didn't land.
      - name: Post-deploy smoke test (analyze-business)
        env:
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Smoke test skipped::PROJECT_REF or anon key missing"
            exit 0
          fi
          URL="https://$PROJECT_REF.supabase.co/functions/v1/analyze-business"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"ping":true}' "$URL" || echo "000")
          echo "analyze-business smoke → HTTP $CODE"
          # 2xx/4xx = function reachable. 5xx or 000 = deploy didn't land.
          if [ "$CODE" -ge 500 ] 2>/dev/null || [ "$CODE" = "000" ]; then
            echo "::error title=Edge function unreachable::analyze-business returned $CODE — deploy may not have landed."
            exit 1
          fi
          echo "✓ analyze-business reachable (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"

      # ── Deploy-fidelity gate ─────────────────────────────────────────────────
      # Curl every function's ?health=1 endpoint and assert live FUNCTION_VERSION
      # matches the constant in source. This is what makes "CI green" actually
      # mean "the new code is live", not "the deploy command exited 0".
      # See scripts/verify-deploy.sh.
      - name: Verify deploy fidelity (live commit_sha == pushed sha)
        env:
          PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          EXPECT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Deploy-fidelity gate skipped::PROJECT_REF or anon key missing"
            exit 0
          fi
          # Give the just-set COMMIT_SHA secret a moment to propagate to warm
          # function replicas before we probe them. A cold-invoke will always
          # see the new env; a still-warm replica may need a beat.
          sleep 10
          bash scripts/verify-deploy.sh

