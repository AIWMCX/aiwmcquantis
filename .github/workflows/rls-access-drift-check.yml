name: RLS Access Drift Check (scheduled)

# Permanent, schema-wide version of the 2026-08-27 Phase 2 audit's two
# exhaustive checks (docs/execution/2026-08-27-phase2-88table-inventory.md):
# no wide-open write policy to public/anon anywhere, no unscoped
# UPDATE/DELETE policy anywhere, checked against the exceptions register
# (docs/execution/2026-08-27-rls-exceptions-register.md) for the small
# set of intentional public-read exceptions. The 10-table incident this
# session closed was exactly this class of drift, existing in production
# for an unknown period with zero migration record -- this exists so
# that never happens silently again.

on:
  schedule:
    - cron: '37 */6 * * *' # every 6 hours, offset from the P0 10-table gate
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check for unreviewed RLS policy exceptions schema-wide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run drift check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing PAT::SUPABASE_ACCESS_TOKEN is not set in GitHub -> Settings -> Environments -> production -> Environment secrets. The gate cannot run without it."
            exit 1
          fi
          deno run --allow-net --allow-env scripts/check-rls-access-drift.ts | tee -a "$GITHUB_STEP_SUMMARY"
