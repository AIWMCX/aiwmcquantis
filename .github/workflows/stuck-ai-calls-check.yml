name: Stuck AI Calls Check (scheduled)

# GTM-audit item #15 (2026-08-26, Q81): "Do we alert a human in real time
# when a pending ai_calls row goes unfinalized?" Confirmed via a real-code
# investigation agent that the answer was no -- a purpose-built partial
# index (ai_calls_pending_idx) existed specifically for this query, but
# nothing ever ran it. This wires scripts/check-stuck-ai-calls.ts into an
# actual recurring check.
#
# Runs every 15 minutes -- frequent enough that a stuck row (isolate
# killed mid-call, per llm-call.ts's two-phase pending/finalize write) is
# caught close to when it happened, not discovered days later. Read-only:
# the script never writes to ai_calls.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check for stuck pending ai_calls rows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check for stuck rows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing PAT::SUPABASE_ACCESS_TOKEN is not set in GitHub -> Settings -> Secrets -> Actions (production environment). The check cannot run without it."
            exit 1
          fi
          deno run --allow-net --allow-env scripts/check-stuck-ai-calls.ts | tee -a "$GITHUB_STEP_SUMMARY"
