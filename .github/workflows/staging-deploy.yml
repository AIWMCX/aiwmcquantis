name: Staging Deploy

# Per-PR / per-branch preview deploy.
# Activates only when VERCEL_TOKEN (or alternative hosting secrets) are present
# in the "staging" GitHub Environment. Otherwise this workflow is a no-op that
# logs guidance, so the repo is always green even before infra is wired.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy preview (staging environment)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (development mode for previews)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build:dev

      - name: Detect deploy provider
        id: provider
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "provider=vercel" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "provider=netlify" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (preview)
        id: deploy
        if: steps.provider.outputs.provider == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          bunx vercel@latest build --token "$VERCEL_TOKEN"
          URL=$(bunx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "preview-url=$URL" >> "$GITHUB_OUTPUT"
          echo "Staging preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Netlify (preview)
        if: steps.provider.outputs.provider == 'netlify'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bunx netlify-cli@latest deploy --dir=dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --json | tee netlify.json
          URL=$(jq -r '.deploy_url' netlify.json)
          echo "Staging preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: No provider configured
        if: steps.provider.outputs.provider == 'none'
        run: |
          {
            echo "## Staging deploy skipped"
            echo ""
            echo "No hosting secrets are configured in the **staging** environment."
            echo ""
            echo "To enable per-PR previews, add one of:"
            echo "- **Vercel**: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            echo "- **Netlify**: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID"
            echo ""
            echo "in Settings → Environments → staging."
          } >> "$GITHUB_STEP_SUMMARY"
