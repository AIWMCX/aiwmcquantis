name: P0 10-Table Regression Check (scheduled)

# Permanent regression lock for the 2026-08-03/04 P0 incident (10 tables
# where anon held full SELECT/INSERT/UPDATE/DELETE via a mislabeled
# service-only policy -- docs/security/2026-08-03-p0-access/, closed by
# migration 20260816010000_p0_10table_exposure_fix.sql, PR #32).
#
# Ported and adapted from PR #26 (never merged -- superseded, see PR #26's
# closing comment). Read-only: only ever SELECTs grant/policy metadata,
# never touches table data.

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check the 10-table incident boundary for regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run regression gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing PAT::SUPABASE_ACCESS_TOKEN is not set in GitHub -> Settings -> Environments -> production -> Environment secrets. The gate cannot run without it."
            exit 1
          fi
          deno run --allow-net --allow-env scripts/check-p0-10table-regression.ts | tee -a "$GITHUB_STEP_SUMMARY"
