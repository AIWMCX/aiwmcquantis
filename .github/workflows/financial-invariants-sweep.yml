name: Financial Invariants Sweep (scheduled)

# GTM-audit item #14 (2026-08-26, Q13): scripts/sweep-financial-invariants.ts
# existed but nothing ran it -- a reusable primitive with no scheduling is
# not a "scheduled sweep," it's a script someone has to remember to run.
# This wires it into an actual recurring health check.
#
# Report-only: never passes --apply. Flagging a historical analysis is a
# production-data-mutating action and stays a deliberate, human-confirmed
# step (see the original PR #93 discussion) -- this workflow's only job is
# to make a violation impossible to miss by failing the job (which surfaces
# in GitHub's existing notification channels) whenever checkFinancialInvariants()
# finds one.

on:
  schedule:
    # 09:00 UTC daily -- a fixed, boring cadence; adjust here if the team
    # wants a different frequency, no code change needed elsewhere.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep historical analyses for invariant violations
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run sweep (report-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing PAT::SUPABASE_ACCESS_TOKEN is not set in GitHub -> Settings -> Environments -> production -> Environment secrets. The sweep cannot run without it."
            exit 1
          fi
          # --node-modules-dir=none: the script imports analyze-business code that
          # pins npm:decimal.js@10.4.3. With package.json in the repo, Deno 2 looks
          # for it in node_modules (absent here) and fails before the sweep starts;
          # this has silently failed every run since 2026-10-29. "none" resolves npm
          # specifiers from Deno's own cache instead.
          deno run --node-modules-dir=none --allow-net --allow-env scripts/sweep-financial-invariants.ts | tee -a "$GITHUB_STEP_SUMMARY"
